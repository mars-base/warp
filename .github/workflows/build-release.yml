name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS aarch64
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure rust target
        run: rustup target add aarch64-apple-darwin

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS aarch64 bundle
        run: |
          script/bundle --channel oss --arch aarch64 --dmg-name-suffix arm64
        env:
          CHANNEL: oss
          GIT_RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-macos-arm64-${{ github.ref_name }}
          path: "*.dmg"

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install and configure gcc-10
        run: |
          sudo apt update
          sudo apt install -y gcc-10 g++-10
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 60 --slave /usr/bin/g++ g++ /usr/bin/g++-10

      - name: Install linuxdeploy
        run: script/linux/install_linuxdeploy

      - name: Clean stale bundle output
        run: rm -rf target/*/bundle/linux

      - name: Build Linux x86_64 bundle
        run: |
          script/bundle --channel oss --packages appimage,deb,rpm
        env:
          CHANNEL: oss
          GIT_RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warp-linux-x86_64-${{ github.ref_name }}
          path: target/*/bundle/linux/

  build-linux-arm:
    name: Build Linux aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install and configure gcc-10
        run: |
          sudo apt update
          sudo apt install -y gcc-10 g++-10
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 60 --slave /usr/bin/g++ g++ /usr/bin/g++-10

      - name: Update PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install linuxdeploy
        run: script/linux/install_linuxdeploy

      - name: Clean stale bundle output
        run: rm -rf target/*/bundle/linux

      - name: Build Linux aarch64 bundle
        run: |
          script/bundle --channel oss --packages appimage
        env:
          CHANNEL: oss
          GIT_RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload Linux aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warp-linux-arm64-${{ github.ref_name }}
          path: target/*/bundle/linux/
